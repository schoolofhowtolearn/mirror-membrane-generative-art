<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Mirror Membrane — 生成アート試作</title>
<style>
  :root{
    --bg:#07080c;
    --panel:rgba(255,255,255,0.06);
    --border:rgba(255,255,255,0.14);
    --text:#eef0f5;
    --sub:#9aa1b0;
    --accent:#7dd3fc;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg); color:var(--text);
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    overflow:hidden;
  }
  #app{position:fixed; inset:0;}
  canvas{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:crosshair;}

  #hud{
    position:fixed; top:16px; left:16px; right:16px;
    display:flex; align-items:flex-start; justify-content:space-between;
    gap:16px; z-index:10; pointer-events:none;
  }
  #title{pointer-events:auto;}
  #title h1{
    margin:0; font-size:15px; font-weight:600; letter-spacing:.02em;
  }
  #title p{
    margin:4px 0 0; font-size:12px; color:var(--sub); max-width:440px; line-height:1.5;
  }
  #tabs{
    pointer-events:auto;
    display:flex; gap:6px; background:var(--panel);
    border:1px solid var(--border); backdrop-filter:blur(10px);
    padding:5px; border-radius:12px;
  }
  .tab{
    appearance:none; border:none; background:transparent; color:var(--sub);
    font-size:12.5px; padding:8px 12px; border-radius:8px; cursor:pointer;
    font-family:inherit; white-space:nowrap; transition:.15s;
  }
  .tab:hover{color:var(--text);}
  .tab.active{background:rgba(255,255,255,0.14); color:var(--text);}

  #foot{
    position:fixed; bottom:14px; left:16px; right:16px;
    display:flex; justify-content:space-between; align-items:flex-end;
    z-index:10; pointer-events:none; font-size:11px; color:var(--sub);
  }
  #foot .badge{
    pointer-events:auto; background:var(--panel); border:1px solid var(--border);
    padding:6px 10px; border-radius:8px; backdrop-filter:blur(10px);
  }
  #fps{opacity:.6;}

  @media (max-width:640px){
    #title p{display:none;}
    .tab{padding:7px 9px; font-size:11.5px;}
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
</div>

<div id="hud">
  <div id="title">
    <h1>Mirror Membrane — 生成アート試作 5種</h1>
    <p id="desc">停止せず永遠に姿を変え続ける生成アートのプロトタイプ。タブで切り替えて見比べられます。</p>
  </div>
  <div id="tabs">
    <button class="tab active" data-mode="flow">フローフィールド</button>
    <button class="tab" data-mode="life">セルオートマトン</button>
    <button class="tab" data-mode="mirror">ミラー膜</button>
    <button class="tab" data-mode="fire">炎</button>
    <button class="tab" data-mode="morpho">モルフォ蝶</button>
  </div>
</div>

<div id="foot">
  <div class="badge" id="hint">クリック・タップした場所から変化が広がります(ドラッグでも反応)</div>
  <div class="badge" id="fps">60 fps</div>
</div>

<script>
(function(){
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = Math.floor(W*DPR); canvas.height = Math.floor(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);

  // ---------- pointer ----------
  const pointer = {x:0.5, y:0.5, active:false, kicks:[]};
  const clickRings = []; // visual feedback shared across all modes
  function setPointer(cx, cy, {ring=false}={}){
    const r = canvas.getBoundingClientRect();
    pointer.x = (cx - r.left)/r.width;
    pointer.y = (cy - r.top)/r.height;
    pointer.kicks.push({x:pointer.x, y:pointer.y, t:performance.now()});
    if(pointer.kicks.length > 8) pointer.kicks.shift();
    if(ring){
      clickRings.push({x:cx - r.left, y:cy - r.top, start: performance.now()});
      if(clickRings.length > 6) clickRings.shift();
    }
  }
  canvas.addEventListener('pointerdown', e=>{
    pointer.active = true;
    setPointer(e.clientX, e.clientY, {ring:true});
  });
  canvas.addEventListener('pointermove', e=>{ if(pointer.active) setPointer(e.clientX,e.clientY); });
  window.addEventListener('pointerup', ()=> pointer.active=false);
  canvas.addEventListener('pointercancel', ()=> pointer.active=false);
  function drawClickRings(now){
    for(let i=clickRings.length-1;i>=0;i--){
      const c = clickRings[i];
      const age = (now - c.start)/1000; // seconds
      if(age > 0.9){ clickRings.splice(i,1); continue; }
      // mirror mode's own ripple wave already marks the tap location, so the
      // shared white ring cursor is redundant there — skip drawing it (still
      // prune it above so it doesn't linger if the mode is switched back)
      if(current === 'mirror') continue;
      const p = age/0.9;
      ctx.beginPath();
      ctx.arc(c.x, c.y, 6 + p*70, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(240,246,255,${0.5*(1-p)})`;
      ctx.lineWidth = 2*(1-p) + 0.4;
      ctx.stroke();
    }
  }

  // ---------- tiny value-noise (no deps) ----------
  const NOISE_SIZE = 256;
  const noisePerm = new Uint8Array(NOISE_SIZE*2);
  (function seedNoise(){
    const p = new Uint8Array(NOISE_SIZE);
    for(let i=0;i<NOISE_SIZE;i++) p[i]=i;
    for(let i=NOISE_SIZE-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      const t = p[i]; p[i]=p[j]; p[j]=t;
    }
    for(let i=0;i<NOISE_SIZE*2;i++) noisePerm[i]=p[i & (NOISE_SIZE-1)];
  })();
  function hsl2rgb(h, s, l){
    h = ((h%360)+360)%360; s/=100; l/=100;
    const c = (1-Math.abs(2*l-1))*s;
    const x = c*(1-Math.abs((h/60)%2-1));
    const m = l-c/2;
    let r=0,g=0,b=0;
    if(h<60){r=c;g=x;b=0;} else if(h<120){r=x;g=c;b=0;}
    else if(h<180){r=0;g=c;b=x;} else if(h<240){r=0;g=x;b=c;}
    else if(h<300){r=x;g=0;b=c;} else {r=c;g=0;b=x;}
    return [(r+m)*255,(g+m)*255,(b+m)*255];
  }
  // Mirror mode redraws its whole (large, fine-grained) pixel buffer every
  // frame, and hsl2rgb's branchy math per-pixel was a measurable chunk of
  // that cost. Its saturation is always 75, so precompute every hue×light
  // combination once at load and turn the per-pixel work into array reads.
  const MIRROR_LUT_SAT = 75;
  const mirrorLUT = (function(){
    const lut = new Uint8ClampedArray(360*101*3);
    for(let h=0; h<360; h++){
      for(let l=0; l<=100; l++){
        const [r,g,b] = hsl2rgb(h, MIRROR_LUT_SAT, l);
        const idx = (h*101+l)*3;
        lut[idx]=r; lut[idx+1]=g; lut[idx+2]=b;
      }
    }
    return lut;
  })();
  // Fire mode's heat->color palette: black -> ember -> red -> orange ->
  // yellow -> near-white, precomputed once and read by index (same reasoning
  // as mirrorLUT — a per-pixel branchy gradient function would be far too
  // slow redrawn every frame at fine grid resolution).
  const fireLUT = (function(){
    const stops = [
      [0,   0,  0,  0],
      [32,  20, 2,  2],
      [64,  90, 8,  2],
      [96,  160,24, 0],
      [128, 210,60, 0],
      [160, 255,110,10],
      [192, 255,170,30],
      [224, 255,215,90],
      [255, 255,250,215]
    ];
    const lut = new Uint8ClampedArray(256*3);
    let si = 0;
    for(let h=0; h<256; h++){
      while(si < stops.length-2 && h > stops[si+1][0]) si++;
      const a = stops[si], b = stops[si+1];
      const span = b[0]-a[0];
      const u = span>0 ? (h-a[0])/span : 0;
      const idx = h*3;
      lut[idx]   = a[1] + (b[1]-a[1])*u;
      lut[idx+1] = a[2] + (b[2]-a[2])*u;
      lut[idx+2] = a[3] + (b[3]-a[3])*u;
    }
    return lut;
  })();
  function fade(t){ return t*t*t*(t*(t*6-15)+10); }
  function grad(hash, x, y, z){
    const h = hash & 15;
    const u = h<8 ? x : y;
    const v = h<4 ? y : (h===12||h===14 ? x : z);
    return ((h&1)===0 ? u : -u) + ((h&2)===0 ? v : -v);
  }
  function perlin3(x,y,z){
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
    x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
    const u = fade(x), v = fade(y), w = fade(z);
    const A = noisePerm[X]+Y, AA = noisePerm[A]+Z, AB = noisePerm[A+1]+Z;
    const B = noisePerm[X+1]+Y, BA = noisePerm[B]+Z, BB = noisePerm[B+1]+Z;
    function lerp(a,b,t){return a+t*(b-a);}
    return lerp(
      lerp(
        lerp(grad(noisePerm[AA],x,y,z), grad(noisePerm[BA],x-1,y,z), u),
        lerp(grad(noisePerm[AB],x,y-1,z), grad(noisePerm[BB],x-1,y-1,z), u), v),
      lerp(
        lerp(grad(noisePerm[AA+1],x,y,z-1), grad(noisePerm[BA+1],x-1,y,z-1), u),
        lerp(grad(noisePerm[AB+1],x,y-1,z-1), grad(noisePerm[BB+1],x-1,y-1,z-1), u), v),
      w);
  }

  // =========================================================
  // MODE 1: continuous cellular automaton (Game-of-Life family
  // with slow random reseeding so it never dies out or freezes)
  // =========================================================
  const Life = (function(){
    let cell = 8, cols, rows, grid, age, next, hueBase=200, t=0;
    function init(){
      cell = Math.max(5, Math.round(Math.min(W,H)/110));
      cols = Math.ceil(W/cell); rows = Math.ceil(H/cell);
      grid = new Uint8Array(cols*rows);
      age = new Float32Array(cols*rows);
      next = new Uint8Array(cols*rows);
      for(let i=0;i<grid.length;i++) grid[i] = Math.random() < 0.28 ? 1 : 0;
      waves = [];
    }
    function idx(x,y){ x=(x+cols)%cols; y=(y+rows)%rows; return y*cols+x; }
    function neighbors(x,y){
      let n=0;
      for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
        if(dx===0&&dy===0) continue;
        n += grid[idx(x+dx,y+dy)];
      }
      return n;
    }
    function kick(px,py,r){
      const cx = Math.floor(px*cols), cy = Math.floor(py*rows);
      const rad = Math.max(3, Math.floor(r*cols));
      for(let y=-rad;y<=rad;y++) for(let x=-rad;x<=rad;x++){
        if(x*x+y*y <= rad*rad && Math.random()<0.5) grid[idx(cx+x,cy+y)] = 1;
      }
    }
    // touching the automaton also sends out an expanding ring of new cells —
    // a literal wave of life propagating outward through the grid
    let waves = [];
    function addWave(px, py){
      waves.push({cx: px*cols, cy: py*rows, age: 0});
      if(waves.length > 5) waves.shift();
    }
    function stampWaves(){
      // the field is usually densely alive, so just "reviving" cells in a
      // ring is invisible against the noise — instead carve a dark leading
      // edge (a literal clearing wavefront) with a bright trailing crest
      // right behind it, so the pulse reads clearly as it sweeps outward
      const speed = 1.15, band = 2.4;
      const reach = Math.max(cols, rows) * 1.3;
      waves = waves.filter(w => w.age*speed < reach);
      for(const w of waves){
        w.age += 1;
        const radius = w.age*speed;
        const rOuter = radius + band;
        const minX = Math.max(0, Math.floor(w.cx-rOuter)), maxX = Math.min(cols-1, Math.ceil(w.cx+rOuter));
        const minY = Math.max(0, Math.floor(w.cy-rOuter)), maxY = Math.min(rows-1, Math.ceil(w.cy+rOuter));
        for(let y=minY;y<=maxY;y++){
          for(let x=minX;x<=maxX;x++){
            const dx=x-w.cx, dy=y-w.cy;
            const d = Math.sqrt(dx*dx+dy*dy);
            if(d > radius && d <= rOuter){
              grid[idx(x,y)] = 0; // dark leading edge — the wavefront clearing a path
            } else if(d > radius - band*1.4 && d <= radius){
              if(Math.random() < 0.9) grid[idx(x,y)] = 1; // bright crest just behind it
            }
          }
        }
      }
    }
    function step(){
      t++;
      for(let y=0;y<rows;y++) for(let x=0;x<cols;x++){
        const i = idx(x,y), n = neighbors(x,y), alive = grid[i];
        // "Day & Night"-like rule tuned to stay lively rather than settle
        let out;
        if(alive) out = (n===2||n===3||n===4||n===5) ? 1 : 0;
        else out = (n===3||n===6||n===7||n===8) ? 1 : 0;
        next[i] = out;
      }
      const tmp = grid; grid = next; next = tmp;
      stampWaves();
      for(let i=0;i<grid.length;i++){
        if(grid[i]) age[i] = Math.min(age[i]+1, 240);
        else age[i] = 0;
      }
      // gentle continuous reseeding so the field never fully stabilizes or dies
      const liveRatio = grid.reduce((a,b)=>a+b,0)/grid.length;
      if(liveRatio < 0.12 || t % 900 === 0){
        for(let k=0;k<Math.floor(cols*rows*0.01);k++){
          const x = Math.floor(Math.random()*cols), y = Math.floor(Math.random()*rows);
          grid[idx(x,y)] = 1;
        }
      }
      if(pointer.active) kick(pointer.x, pointer.y, 0.03);
      while(pointer.kicks.length){
        const k = pointer.kicks.shift();
        kick(k.x, k.y, 0.05);
        addWave(k.x, k.y);
      }
    }
    function draw(){
      ctx.fillStyle = 'rgba(4,5,9,0.5)';
      ctx.fillRect(0,0,W,H);
      hueBase = (hueBase + 0.05) % 360;
      for(let y=0;y<rows;y++) for(let x=0;x<cols;x++){
        const i = idx(x,y);
        if(!grid[i]) continue;
        const a = age[i];
        const hue = (hueBase + x*0.6 + y*0.3) % 360;
        const light = 45 + Math.min(30, a*0.25);
        ctx.fillStyle = `hsla(${hue}, 85%, ${light}%, ${0.55 + Math.min(0.4, a/240)})`;
        ctx.fillRect(x*cell, y*cell, cell-1, cell-1);
      }
    }
    return {
      init, tick(){ step(); draw(); },
      resize(){ init(); }
    };
  })();

  // =========================================================
  // MODE 2: flow field of particles drifting through evolving
  // Perlin noise — a slowly, endlessly morphing organic field
  // =========================================================
  const Flow = (function(){
    // ambient particles are the field's persistent "light" — always exactly
    // `baseCount` of them, always respawning. click/tap sparks live in a
    // separate, capped array so a long drag can never crowd out the ambient
    // light (that used to happen: bursts and ambient shared one array with
    // a front-shift cap, which silently deleted the ambient particles first)
    let particles = [], bursts = [], impulses = [], z = 0, hue = 190, baseCount = 0, pulseT = 0;
    function init(){
      baseCount = Math.floor((W*H)/9000);
      particles = new Array(baseCount).fill(0).map(()=>({
        x: Math.random()*W, y: Math.random()*H,
        px:0, py:0, life: Math.random()*200
      }));
      particles.forEach(p=>{p.px=p.x; p.py=p.y;});
      bursts = [];
      impulses = [];
      pulseT = Math.random()*10;
      ctx.fillStyle = '#05060a';
      ctx.fillRect(0,0,W,H);
    }
    function driftAngle(x, y, z, scale){
      return perlin3(x*scale, y*scale, z) * Math.PI * 4;
    }
    // large, slow-moving zones of fast/slow flow, so the light doesn't drift
    // at one constant pace — patches speed up and lull independently
    function speedZone(x, y, z){
      const n = perlin3(x*0.0009, y*0.0009, z*0.6 + 500);
      return 0.3 + (n+1)/2 * 1.6; // ~0.3x (lull) .. 1.9x (surge)
    }
    function step(){
      z += 0.0018;
      pulseT += 0.006; // slow global breathing rhythm layered on top of the local zones
      const pulse = 0.7 + Math.sin(pulseT)*0.45; // ~0.25x .. 1.15x
      hue = (hue + 0.06) % 360;
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgba(5,6,10,0.045)';
      ctx.fillRect(0,0,W,H);

      // every click/tap becomes an expanding shockwave ring that sweeps
      // outward and shoves nearby particles, plus a burst of fresh sparks
      while(pointer.kicks.length){
        const k = pointer.kicks.shift();
        impulses.push({x:k.x*W, y:k.y*H, age:0, extra: 26});
        for(let i=0;i<24;i++){
          const a = Math.random()*Math.PI*2, sp = 1+Math.random()*2;
          bursts.push({
            x:k.x*W, y:k.y*H, px:k.x*W, py:k.y*H,
            life: 40+Math.random()*40, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp
          });
        }
      }
      if(impulses.length > 16) impulses.splice(0, impulses.length-16);
      for(let i=impulses.length-1;i>=0;i--){
        impulses[i].age += 1;
        if(impulses[i].age > 100) impulses.splice(i,1);
      }
      if(bursts.length > 300) bursts.splice(0, bursts.length-300); // cap sparks only — never touches ambient particles

      const scale = 0.0016;
      ctx.globalCompositeOperation = 'lighter'; // additive blend so crossing streaks glow brighter, like real light

      // ambient, persistent particles — this is the base light and it must never run dry
      for(const p of particles){
        p.px = p.x; p.py = p.y;
        const angle = driftAngle(p.x, p.y, z, scale);
        const tempo = speedZone(p.x, p.y, z) * pulse; // where/when this particle sits fast vs slow
        let vx = Math.cos(angle) * tempo, vy = Math.sin(angle) * tempo;
        if(pointer.active){
          const dx = p.x - pointer.x*W, dy = p.y - pointer.y*H;
          const d2 = dx*dx+dy*dy;
          if(d2 < 40000){ const f = (40000-d2)/40000; vx += dx*0.002*f; vy += dy*0.002*f; }
        }
        for(const imp of impulses){
          const dx = p.x - imp.x, dy = p.y - imp.y;
          const d = Math.sqrt(dx*dx+dy*dy) || 1;
          const diff = Math.abs(d - imp.age*7);
          if(diff < imp.extra){
            const strength = (1 - diff/imp.extra) * Math.max(0, 1 - imp.age/100) * 3.4;
            vx += (dx/d)*strength; vy += (dy/d)*strength;
          }
        }
        p.x += vx*1.6; p.y += vy*1.6;
        p.life -= 1;
        if(p.x<0||p.x>W||p.y<0||p.y>H||p.life<=0){
          p.x = Math.random()*W; p.y = Math.random()*H;
          p.px = p.x; p.py = p.y; p.life = 120+Math.random()*200;
        }
        const h = (hue + (p.x+p.y)*0.03) % 360;
        // soft wide halo underneath a bright core — with additive blending
        // this makes dense/fast streaks visibly glow instead of just being opaque
        ctx.strokeStyle = `hsla(${h}, 95%, 68%, 0.3)`;
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(p.px, p.py);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
        ctx.strokeStyle = `hsla(${h}, 100%, 80%, 1)`;
        ctx.lineWidth = 2.1;
        ctx.beginPath();
        ctx.moveTo(p.px, p.py);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      }

      // click sparks — brighter and hotter, simply expire, never respawn
      for(let i=bursts.length-1;i>=0;i--){
        const p = bursts[i];
        p.px = p.x; p.py = p.y;
        const angle = driftAngle(p.x, p.y, z, scale);
        let vx = Math.cos(angle) + p.vx, vy = Math.sin(angle) + p.vy;
        p.vx *= 0.9; p.vy *= 0.9;
        p.x += vx*1.6; p.y += vy*1.6;
        p.life -= 1;
        const h = (hue + (p.x+p.y)*0.03) % 360;
        ctx.strokeStyle = `hsla(${h}, 95%, 75%, 0.4)`;
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(p.px, p.py);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
        ctx.strokeStyle = `hsla(${h}, 100%, 85%, 1)`;
        ctx.lineWidth = 2.1;
        ctx.beginPath();
        ctx.moveTo(p.px, p.py);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
        if(p.x<0||p.x>W||p.y<0||p.y>H||p.life<=0) bursts.splice(i,1);
      }
      ctx.globalCompositeOperation = 'source-over';
    }
    return { init, tick(){ step(); }, resize(){ init(); } };
  })();

  // =========================================================
  // MODE 3: rippling "mirror membrane" — a warped reflective
  // surface driven by overlapping oscillators + noise + touch
  // =========================================================
  const Mirror = (function(){
    // Rendered through a small offscreen pixel buffer that gets scaled up
    // with nearest-neighbor sampling — this keeps a very fine grid fast,
    // since it's one buffer fill + one drawImage instead of thousands of
    // individual fillRect calls.
    let t = 0, flowT = 0, ripples = [];
    let grid, cols, rows, off, offCtx, imgData, buf;
    const B = 4; // noise block size in fine cells — see note below
    let bcols, brows, blockN, blockWarp;
    function init(){
      ripples = [];
      grid = Math.max(3, Math.round(Math.min(W,H)/220)); // finer mesh, scales with screen size
      cols = Math.ceil(W/grid); rows = Math.ceil(H/grid);
      off = document.createElement('canvas');
      off.width = cols; off.height = rows;
      offCtx = off.getContext('2d');
      imgData = offCtx.createImageData(cols, rows);
      buf = imgData.data;
      bcols = Math.ceil(cols/B)+1; brows = Math.ceil(rows/B)+1;
      blockN = new Float32Array(bcols*brows);
      blockWarp = new Float32Array(bcols*brows);
    }
    function addRipple(x,y){
      ripples.push({x, y, t: t, strength: 1});
      if(ripples.length > 6) ripples.shift();
    }
    function step(){
      t += 0.012;
      // slow breathing tempo for the base drift — layering two off-beat sine
      // waves avoids a mechanical, constant-speed crawl and gives the surface
      // the alternating fast/slow "breathing" feel of the real membrane
      const tempo = 0.5 + 0.35*Math.sin(t*0.05) + 0.2*Math.sin(t*0.123 + 1.3);
      flowT += 0.012 * Math.max(0.12, tempo);

      while(pointer.kicks.length){
        const k = pointer.kicks.shift();
        addRipple(k.x*W, k.y*H);
      }
      if(pointer.active && Math.random()<0.3) addRipple(pointer.x*W, pointer.y*H);

      // drop fully-decayed ripples so a long drag doesn't keep paying for
      // trig work whose contribution has become visually negligible
      ripples = ripples.filter(r => (t - r.t) < 3);
      const reachGrid = 700 / grid; // beyond this (px) the wave's amplitude is ~0
      const reachGrid2 = reachGrid*reachGrid;
      const hasRipples = ripples.length > 0;

      // the base drift noise and the ring-warp noise are both low-frequency —
      // they barely change from one fine cell to the next — so sample them
      // once per BxB block and reuse across the block instead of once per
      // cell. This is what makes a fine (small-pixel) grid affordable: the
      // per-cell cost stays limited to the cheap ripple math (sqrt/sin/exp),
      // while the expensive perlin3 calls drop by ~B² (16x at B=4).
      for(let bj=0; bj<brows; bj++){
        for(let bi=0; bi<bcols; bi++){
          const x = bi*B*grid, y = bj*B*grid;
          // domain-warp the sample point with a slower, larger-scale noise
          // field before reading the base drift noise — a plain single-octave
          // sample only ever varies smoothly along one axis, which reads as
          // static parallel bands. Warping the coordinates first folds that
          // into swirling, organic motion much closer to how the real
          // membrane's overlapping actuator/vibration frequencies look.
          // two decorrelated warp fields (different scale, phase and offset)
          // so the displacement isn't a near-uniform shear — that's what was
          // still reading as parallel diagonal ridges rather than blobs/swirls
          const wx = x + perlin3(x*0.0022, y*0.0022, flowT*0.4 + 11) * 480;
          const wy = y + perlin3(x*0.0022 - 300, y*0.0022 + 300, flowT*0.4 + 77) * 480;
          const base = perlin3(wx*0.004, wy*0.004, flowT) * 9;
          const detail = perlin3(wx*0.011 + 500, wy*0.011 + 500, flowT*1.7 + 50) * 4;
          blockN[bj*bcols+bi] = base + detail;
          // ring-boundary jitter: this needs a wavelength comparable to (or
          // shorter than) the ripple's own radius, otherwise it barely
          // changes across one ring and just shifts its phase uniformly —
          // which leaves the ring perfectly round, only rotated in effect.
          // Sampling in pixel space at a much higher frequency, plus a
          // second finer layer, actually breaks the circle into an
          // irregular, organic edge.
          blockWarp[bj*bcols+bi] = hasRipples
            ? perlin3(x*0.006, y*0.006, t*0.35) * 55 + perlin3(x*0.017+200, y*0.017+200, t*0.6+300) * 24
            : 0;
        }
      }

      for(let j=0;j<rows;j++){
        const bj = j>>2;
        for(let i=0;i<cols;i++){
          const bi = i>>2;
          const bIdx = bj*bcols+bi;
          let disp = blockN[bIdx];
          const warp = blockWarp[bIdx];
          for(const r of ripples){
            const dx = i-r.x/grid, dy = j-r.y/grid;
            const dist2 = dx*dx+dy*dy;
            if(dist2 > reachGrid2) continue;
            const dist = Math.sqrt(dist2)*grid + warp;
            const age = t - r.t;
            // the exponential falloff still has ~17% amplitude left at the
            // 700px reach cutoff, so simply stopping there printed a hard,
            // very visible ring where the math just switches off. Taper the
            // last stretch down to exactly 0 with a smoothstep so it fades
            // out before the cutoff instead of snapping off.
            let edgeFade = 1;
            if(dist > 500){
              const u = Math.min(1, (dist-500)/200);
              edgeFade = 1 - u*u*(3-2*u);
            }
            const wave = Math.sin(dist*0.05 - age*6) * Math.exp(-age*0.7) * Math.exp(-dist*0.0025);
            disp += wave*17*edgeFade;
          }
          // hue now tracks only the (already organic, warped) disp field plus
          // a slow global drift — a spatial-linear term here would print
          // straight bands over the blobby noise regardless of its shape
          let hueI = Math.round(200 + disp*5 + Math.sin(t*0.25)*15) % 360;
          if(hueI < 0) hueI += 360;
          const lightF = 50 + disp*1.4;
          const lightI = lightF < 15 ? 15 : (lightF > 80 ? 80 : lightF)|0;
          const lutIdx = (hueI*101+lightI)*3;
          const alpha = 0.92; // matches the previous slight blend toward the black backdrop
          const p = (j*cols+i)*4;
          buf[p] = mirrorLUT[lutIdx]*alpha; buf[p+1] = mirrorLUT[lutIdx+1]*alpha; buf[p+2] = mirrorLUT[lutIdx+2]*alpha; buf[p+3] = 255;
        }
      }
      offCtx.putImageData(imgData, 0, 0);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(off, 0, 0, cols, rows, 0, 0, W, H);
    }
    return { init, tick(){ step(); }, resize(){ init(); } };
  })();

  const Fire = (function(){
    // Classic "Doom fire" style: a small heat grid where every cell above
    // the bottom row copies the cell below it, minus a random decay and a
    // small random horizontal jitter. Repeated every frame, this alone is
    // enough to produce a convincing flickering flame with no noise calls
    // at all — cheap enough to run at a fine grid and then upscale smoothly
    // (unlike Mirror's crisp nearest-neighbor look, fire wants soft edges).
    const CELL = 4;
    let cols, rows, off, offCtx, imgData, buf, heat;
    let decayScale;
    function init(){
      cols = Math.max(24, Math.ceil(W/CELL));
      rows = Math.max(24, Math.ceil(H/CELL));
      off = document.createElement('canvas');
      off.width = cols; off.height = rows;
      offCtx = off.getContext('2d');
      imgData = offCtx.createImageData(cols, rows);
      buf = imgData.data;
      heat = new Uint8ClampedArray(cols*rows);
      // tuned so the flame decays to nothing a bit above mid-screen on
      // average, regardless of how many rows the current viewport gives us
      decayScale = Math.max(3, Math.round(720/rows));
    }
    function seedBase(){
      // bottom two rows are the "fuel": always hot, always flickering —
      // this alone keeps the flame going forever with no interaction
      for(let x=0;x<cols;x++){
        heat[(rows-1)*cols+x] = 195 + ((Math.random()*61)|0);
      }
      if(rows>1){
        for(let x=0;x<cols;x++){
          heat[(rows-2)*cols+x] = 150 + ((Math.random()*80)|0);
        }
      }
    }
    function injectBlob(px, py, radius, strength){
      const gx = Math.floor(px/W*cols), gy = Math.floor(py/H*rows);
      const r2 = radius*radius;
      for(let dy=-radius; dy<=radius; dy++){
        const yy = gy+dy;
        if(yy<0 || yy>=rows) continue;
        const rowBase = yy*cols;
        for(let dx=-radius; dx<=radius; dx++){
          if(dx*dx+dy*dy>r2) continue;
          const xx = gx+dx;
          if(xx<0 || xx>=cols) continue;
          const idx = rowBase+xx;
          heat[idx] = Math.max(heat[idx], strength);
        }
      }
    }
    function step(){
      seedBase();
      // a click drops a hot blob right where you tapped, which then rises
      // and warps the flame on its way up, same as tapping a real flame
      while(pointer.kicks.length){
        const k = pointer.kicks.shift();
        injectBlob(k.x*W, k.y*H, 5, 255);
      }
      if(pointer.active) injectBlob(pointer.x*W, pointer.y*H, 4, 255);

      for(let y=1; y<rows; y++){
        const rowBase = y*cols;
        const rowAbove = rowBase-cols;
        for(let x=0; x<cols; x++){
          const src = rowBase+x;
          const v = heat[src];
          if(v===0){ heat[rowAbove+x] = 0; continue; }
          const jitter = (Math.random()*3)|0; // 0, 1 or 2
          let dstX = x + (1-jitter); // shifts -1..+1
          if(dstX<0) dstX = 0; else if(dstX>=cols) dstX = cols-1;
          const decay = (jitter & 1) * decayScale;
          heat[rowAbove+dstX] = v>decay ? v-decay : 0;
        }
      }

      for(let i=0, n=cols*rows; i<n; i++){
        const lutIdx = heat[i]*3;
        const p = i*4;
        buf[p]=fireLUT[lutIdx]; buf[p+1]=fireLUT[lutIdx+1]; buf[p+2]=fireLUT[lutIdx+2]; buf[p+3]=255;
      }
      offCtx.putImageData(imgData, 0, 0);
      ctx.imageSmoothingEnabled = true; // soft upscale — fire should look soft, not pixelated
      ctx.drawImage(off, 0, 0, cols, rows, 0, 0, W, H);
    }
    return { init, tick(){ step(); }, resize(){ init(); } };
  })();

  // =========================================================
  // MODE 5: light-particle Morpho butterflies drifting through
  // the dark, each made of glowing points instead of a solid
  // shape. Touching one scatters it into drifting, fading light
  // that softly disperses — a new butterfly is then born, fully
  // formed from its own gathering light, somewhere else on screen.
  // =========================================================
  // Every butterfly shares one silhouette, built once: two ellipse
  // "wings" per side (a larger swept forewing, a smaller hindwing)
  // filled by rejection-sampling random points inside them, plus a
  // short line of points down the body. Reused as a rigid template —
  // each butterfly just transforms it by its own position, heading
  // and wing-flap phase every frame, rather than resampling points.
  const MORPHO_TEMPLATE = (function(){
    function sampleEllipse(cx, cy, rx, ry){
      for(let tries=0; tries<40; tries++){
        const x = cx + (Math.random()*2-1)*rx;
        const y = cy + (Math.random()*2-1)*ry;
        if(((x-cx)*(x-cx))/(rx*rx) + ((y-cy)*(y-cy))/(ry*ry) <= 1) return [x, y];
      }
      return [cx, cy];
    }
    const FORE = {cx:0.42, cy:-0.10, rx:0.50, ry:0.40}; // upper, larger forewing
    const HIND = {cx:0.30, cy:0.34, rx:0.34, ry:0.30};  // lower, smaller hindwing
    const N_FORE = 56, N_HIND = 40, N_BODY = 16;
    const pts = [];
    for(const side of [1, -1]){
      for(let i=0;i<N_FORE;i++){
        const [x,y] = sampleEllipse(FORE.cx, FORE.cy, FORE.rx, FORE.ry);
        const tx = x*side;
        pts.push({tx, ty: y, body:false, absTx: Math.abs(tx), tx2: tx*tx});
      }
      for(let i=0;i<N_HIND;i++){
        const [x,y] = sampleEllipse(HIND.cx, HIND.cy, HIND.rx, HIND.ry);
        const tx = x*side;
        pts.push({tx, ty: y, body:false, absTx: Math.abs(tx), tx2: tx*tx});
      }
    }
    for(let i=0;i<N_BODY;i++){
      const ty = -0.15 + 0.70*(i/(N_BODY-1));
      pts.push({tx: (Math.random()-0.5)*0.03, ty, body:true});
    }
    return pts;
  })();

  const Morpho = (function(){
    const DISSOLVE_MS = 2.4;    // seconds a touched butterfly's light takes to flow to the next spot
    const MATERIALIZE_MS = 0.9; // seconds a new butterfly takes to gather into shape
    const EDGE_MARGIN = 110;    // px from the border where flight gently steers back inward
    const BOB_PX = 4;           // small vertical bob synced to the wingbeat, for a flitting feel
    const MIN_NEXT_DIST_FRAC = 0.4; // next birth spot is at least this fraction of the screen diagonal away
    // trailing echoes drawn behind each flowing particle, nearest-first —
    // together they read as a soft, blurred streak of light in motion
    // rather than a single hard dot, like water flowing past
    const TRAIL_OFFSETS = [0.025, 0.055, 0.09, 0.14, 0.20];
    const TRAIL_FADE =    [0.55,  0.36,  0.22, 0.12, 0.05];
    // the same blurred, widening-echo trail language as the dissolve
    // effect above, but sampled from each particle's actual recent
    // positions instead of a precomputed bezier — so ordinary flapping
    // flight reads as the same soft flowing light, not just the dissolve
    const FLIGHT_TRAIL_LEN = 3;
    const FLIGHT_TRAIL_FADE = [0.34, 0.20, 0.10];
    // only a random subset of each butterfly's particles carry a flowing
    // trail during ordinary flight — applying it to every one of a wing's
    // ~170 particles across up to 9 butterflies at once is far more particles
    // than the single-butterfly dissolve effect ever draws at a time, so a
    // sampled subset keeps the same flowing-water look at a steady framerate
    const FLIGHT_TRAIL_CHANCE = 0.12;
    let butterflies = [];
    let BASE_SCALE = 50;
    let lastT = null;

    function randRange(a, b){ return a + Math.random()*(b-a); }

    // (re)initializes one butterfly in place — used both for the initial
    // population and to recycle a slot once its dissolve finishes, so the
    // flock never grows or shrinks, it just quietly replaces its members.
    // opts.x/y/heading/sizeMult/hueBase pin it to exactly what a dissolving
    // butterfly's light already committed to and flowed toward, instead of
    // a fresh random draw, so the new butterfly continues seamlessly from
    // the light that arrived rather than popping to a different pose/scale.
    function spawnButterfly(b, opts){
      opts = opts || {};
      b.x = opts.x !== undefined ? opts.x : randRange(W*0.15, W*0.85);
      b.y = opts.y !== undefined ? opts.y : randRange(H*0.15, H*0.75);
      b.heading = opts.heading !== undefined ? opts.heading : Math.random()*Math.PI*2;
      b.headingZ = Math.random()*1000;
      b.seed = Math.random()*1000;
      b.speed = randRange(24, 40);
      b.flapPhase = Math.random()*Math.PI*2;
      b.flapSpeed = randRange(1.3, 2.1);
      b.flapNoiseZ = Math.random()*1000; // drives organic speeding-up/slowing-down of the wingbeat
      b.flapVar = 1;
      b.sizeMult = opts.sizeMult !== undefined ? opts.sizeMult : randRange(0.8, 1.3);
      b.hueBase = opts.hueBase !== undefined ? opts.hueBase : randRange(206, 224); // vivid morpho electric blue
      b.scalePx = BASE_SCALE * b.sizeMult;
      b.hitR = b.scalePx * 0.9;
      b.state = 'materializing';
      // staggering the start slightly (some already-positive, some still
      // negative) means a freshly (re)populated flock doesn't all snap
      // into being on the exact same frame
      b.stateT = -Math.random()*MATERIALIZE_MS*0.6;
      b.particles = MORPHO_TEMPLATE.map(t=>{
        // a small settling jitter, not a big scatter — when this follows a
        // dissolve, each particle already flew in to roughly its own spot
        // in this body, so materializing now just gently sharpens the
        // shape into focus instead of gathering it from far away
        const ang = Math.random()*Math.PI*2, dist = randRange(8, 26);
        return {
          tx: t.tx, ty: t.ty, body: t.body, absTx: t.absTx, tx2: t.tx2,
          mox: Math.cos(ang)*dist, moy: Math.sin(ang)*dist, // materialize: scatter offset that converges to 0
          twinkle: Math.random()*Math.PI*2,
          twinkleSpeed: randRange(1.5, 3.5),
          sizeJ: randRange(0.75, 1.25),
          flickSeed: Math.random()*1000, // drives an irregular, non-periodic flicker via perlin noise
          trail: null, // lazily filled with recent world positions once this particle starts rendering 'alive'
          trailOn: Math.random() < FLIGHT_TRAIL_CHANCE
          // dissolve fields (startX/Y, ctrlX/Y, delay) are added by
          // beginDissolve() once this butterfly is actually touched
        };
      });
      return b;
    }

    function init(){
      BASE_SCALE = Math.max(34, Math.min(70, Math.min(W, H)*0.07));
      const count = Math.max(4, Math.min(9, Math.round((W*H)/130000)));
      butterflies = new Array(count).fill(0).map(()=> spawnButterfly({}));
      lastT = null;
      ctx.fillStyle = '#05070e';
      ctx.fillRect(0, 0, W, H);
    }

    // where a template point sits in world space for any given pose —
    // wings pinch toward the body and spread back out via `openness`, the
    // whole shape then rotated to face `heading` and placed at (x, originY)
    function poseWorldPos(tx, ty, body, x, originY, heading, scalePx, openness){
      const lx = body ? tx : tx*openness;
      const ly = ty;
      const phi = heading + Math.PI/2;
      const cos = Math.cos(phi), sin = Math.sin(phi);
      const wx = lx*cos - ly*sin, wy = lx*sin + ly*cos;
      return [x + wx*scalePx, originY + wy*scalePx];
    }
    // a template point's current world position for a butterfly in its
    // normal rigid (alive/materializing) flight pose — a plain fan-fold:
    // every point scales toward/away from the body in lockstep via the
    // same openness value, no per-point lag or bow
    function templateWorldPos(b, p, originY){
      const openness = 0.15 + 0.85*Math.abs(Math.sin(b.flapPhase));
      return poseWorldPos(p.tx, p.ty, p.body, b.x, originY, b.heading, b.scalePx, openness);
    }

    // picks a birth spot for the next butterfly that's at least a good
    // fraction of the screen's diagonal away from the touch point, so the
    // light has a real distance to visibly travel rather than sometimes
    // landing right next door by chance
    function pickFarPoint(fromX, fromY){
      const minDist = Math.hypot(W, H) * MIN_NEXT_DIST_FRAC;
      let x = fromX, y = fromY;
      for(let tries=0; tries<14; tries++){
        x = randRange(W*0.15, W*0.85);
        y = randRange(H*0.15, H*0.75);
        if(Math.hypot(x-fromX, y-fromY) >= minDist) break;
      }
      return [x, y];
    }

    function beginDissolve(b, renderY){
      b.state = 'dissolving';
      b.stateT = 0;
      // decide right now everything about the next butterfly — where,
      // which way it faces, how big, what hue — so this one's light has
      // somewhere concrete to flow toward, and the handoff when it
      // actually arrives is completely seamless
      [b.nextX, b.nextY] = pickFarPoint(b.x, renderY);
      b.nextHeading = Math.random()*Math.PI*2;
      b.nextSizeMult = randRange(0.8, 1.3);
      b.nextHue = randRange(206, 224);
      const nextScalePx = BASE_SCALE * b.nextSizeMult;
      for(const p of b.particles){
        const [wx, wy] = templateWorldPos(b, p, renderY);
        const dx0 = wx - b.x, dy0 = wy - renderY;
        const d0 = Math.hypot(dx0, dy0) || 1;
        const bulge = 30 + Math.random()*60;
        p.startX = wx; p.startY = wy;
        // each particle's own arrival point is already its place in the
        // NEXT butterfly's silhouette (a half-open wing pose at the new
        // heading and size) — not one shared point every particle funnels
        // into — so the flock arrives already loosely shaped like a body
        // instead of collapsing to a single dot and then re-expanding
        const [ex, ey] = poseWorldPos(p.tx, p.ty, p.body, b.nextX, b.nextY, b.nextHeading, nextScalePx, 0.5);
        p.endX = ex; p.endY = ey;
        // a control point bulging outward from the straight line to that
        // arrival point, so each particle briefly scatters away from the
        // body (still "becoming light") before curving into a stream
        p.ctrlX = (wx+ex)/2 + (dx0/d0)*bulge + (Math.random()-0.5)*90;
        p.ctrlY = (wy+ey)/2 + (dy0/d0)*bulge + (Math.random()-0.5)*90 - 26;
        p.delay = Math.random()*0.22; // staggered start so the flow ripples rather than snapping in unison
      }
    }

    // a flowing particle's position at progress `t` (0..1) along its own
    // start -> bulge control point -> its place in the new body, quadratic bezier
    function dissolvePos(p, t){
      const te = t*t*(3-2*t); // smoothstep easing along the path
      const omt = 1-te;
      return [
        omt*omt*p.startX + 2*omt*te*p.ctrlX + te*te*p.endX,
        omt*omt*p.startY + 2*omt*te*p.ctrlY + te*te*p.endY
      ];
    }

    function updateFlight(b, dt){
      // heading wanders on its own slow Perlin stream (one per butterfly,
      // via its own fixed `seed`), same idea as Fire's drift field, just
      // steering a heading angle instead of biasing a column
      b.headingZ += 0.5*dt;
      const turn = perlin3(b.seed, 0, b.headingZ) * 1.8;
      b.heading += turn*dt;
      // softly steer back toward center near the edges instead of a hard
      // wall or wraparound, so the flight stays natural-looking
      const edgeDist = Math.min(b.x, W-b.x, b.y, H-b.y);
      if(edgeDist < EDGE_MARGIN){
        const push = 1 - edgeDist/EDGE_MARGIN;
        const toCenter = Math.atan2(H/2-b.y, W/2-b.x);
        let diff = toCenter - b.heading;
        diff = Math.atan2(Math.sin(diff), Math.cos(diff));
        b.heading += diff*push*3.0*dt;
      }
      b.flapPhase += b.flapSpeed*b.flapVar*dt;
      const spd = b.speed*(0.85+0.15*Math.sin(b.flapPhase*0.5));
      b.x += Math.cos(b.heading)*spd*dt;
      b.y += Math.sin(b.heading)*spd*dt;
      b.x = Math.min(Math.max(b.x, 10), W-10);
      b.y = Math.min(Math.max(b.y, 10), H-10);
    }

    function step(dt){
      // touches: a tap/click, or the pointer resting on a butterfly while
      // held down, both dissolve it — consumed once per frame so a long
      // drag doesn't retrigger every single frame
      const kicks = [];
      while(pointer.kicks.length) kicks.push(pointer.kicks.shift());
      for(const b of butterflies){
        if(b.state !== 'alive') continue;
        const renderY = b.y + Math.sin(b.flapPhase*2)*BOB_PX;
        let hit = false;
        for(const k of kicks){
          const dx = k.x*W-b.x, dy = k.y*H-renderY;
          if(dx*dx+dy*dy < b.hitR*b.hitR){ hit = true; break; }
        }
        if(!hit && pointer.active){
          const dx = pointer.x*W-b.x, dy = pointer.y*H-renderY;
          if(dx*dx+dy*dy < b.hitR*b.hitR) hit = true;
        }
        if(hit) beginDissolve(b, renderY);
      }

      for(const b of butterflies){
        // the wingbeat's pace itself drifts on a slow Perlin stream —
        // sometimes quicker flutters, sometimes an easy glide — instead
        // of ticking at one perfectly metronomic rate forever
        b.flapNoiseZ += 0.6*dt;
        b.flapVar = 0.55 + 0.75*(perlin3(b.seed+50, 0, b.flapNoiseZ)*0.5+0.5);
        if(b.state === 'alive'){
          updateFlight(b, dt);
        } else if(b.state === 'materializing'){
          b.flapPhase += b.flapSpeed*b.flapVar*dt*0.6;
          b.stateT += dt;
          if(b.stateT >= MATERIALIZE_MS) { b.state = 'alive'; b.stateT = 0; }
        } else if(b.state === 'dissolving'){
          b.stateT += dt;
          // +0.22 covers the largest per-particle start delay, so every
          // particle has finished its flow to (nextX,nextY) before the
          // slot is recycled there
          if(b.stateT >= DISSOLVE_MS + 0.22){
            spawnButterfly(b, {x:b.nextX, y:b.nextY, heading:b.nextHeading, sizeMult:b.nextSizeMult, hueBase:b.nextHue});
          }
        }
      }
    }

    // an irregular, non-periodic flicker (as opposed to a smooth sine
    // pulse) — layers a slow perlin drift with a faster one so each
    // particle randomly dims and brightens on its own uneven rhythm,
    // occasionally dipping quite low, like real scintillating light
    function particleFlick(p){
      const t = performance.now()*0.001;
      const slow = perlin3(p.flickSeed, 0, t*p.twinkleSpeed*0.35);
      const fast = perlin3(p.flickSeed + 500, 0, t*p.twinkleSpeed*1.1 + p.twinkle);
      const n = slow*0.65 + fast*0.35; // roughly -1..1, biased toward the slow drift
      return Math.max(0.12, Math.min(1, 0.55 + 0.55*n));
    }

    function drawParticle(x, y, b, p, alphaMult, sizeMult, glowMult){
      sizeMult = sizeMult || 1;
      glowMult = glowMult || 1;
      const hue = b.hueBase + Math.sin(b.flapPhase + p.tx*4)*13; // iridescent shimmer, kept within true morpho blue
      const flick = particleFlick(p);
      const core = 0.82*p.sizeJ*b.sizeMult*sizeMult;
      const a = Math.max(0, Math.min(1, alphaMult*flick));
      if(a <= 0.01) return;
      // glowMult only swells the soft halo, not the already-bright core —
      // that's what reads as "more light" without just clipping to solid white
      ctx.beginPath();
      ctx.arc(x, y, core*2.9*glowMult, 0, Math.PI*2);
      ctx.fillStyle = `hsla(${hue},100%,62%,${Math.min(1, 0.21*a*glowMult)})`;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x, y, core, 0, Math.PI*2);
      ctx.fillStyle = `hsla(${hue},100%,78%,${a})`;
      ctx.fill();
    }

    // faded, progressively larger echoes behind a particle's last few
    // positions — the same "light flowing through water" look the
    // dissolve effect uses, applied to ordinary flapping flight
    function drawFlightTrail(b, p){
      if(!p.trail) return;
      const hue = b.hueBase + Math.sin(b.flapPhase + p.tx*4)*13;
      const core = 0.82*p.sizeJ*b.sizeMult;
      for(let k=0;k<p.trail.length;k++){
        const fade = FLIGHT_TRAIL_FADE[k];
        if(!fade) continue;
        const tp = p.trail[k];
        ctx.beginPath();
        ctx.arc(tp.x, tp.y, core*(2.0+k*1.7), 0, Math.PI*2);
        ctx.fillStyle = `hsla(${hue},100%,66%,${fade})`;
        ctx.fill();
      }
    }

    // a short soft streak from a particle's previous frame position to its
    // current one, plus the bright dot itself — redrawn fresh every frame
    // (no persistent canvas trail), so normal flight reads as a flowing
    // thread of light without the wingbeat's breathing motion smearing
    // into the "sunburst" a real accumulating trail produced
    function drawFlightStreak(px, py, x, y, b, p){
      const hue = b.hueBase + Math.sin(b.flapPhase + p.tx*4)*13;
      const flick = particleFlick(p);
      const core = 0.82*p.sizeJ*b.sizeMult;
      ctx.lineCap = 'round';
      ctx.strokeStyle = `hsla(${hue},100%,64%,${0.15*flick})`;
      ctx.lineWidth = core*3.0;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(x, y); ctx.stroke();
      ctx.strokeStyle = `hsla(${hue},100%,78%,${0.85*flick})`;
      ctx.lineWidth = core*1.2;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(x, y); ctx.stroke();
      ctx.beginPath();
      ctx.arc(x, y, core, 0, Math.PI*2);
      ctx.fillStyle = `hsla(${hue},100%,80%,${flick})`;
      ctx.fill();
    }

    function render(){
      // a near-hard clear each frame — every wing particle's local x
      // position breathes in and out together as the wings flap, so any
      // real motion trail turns that shared, correlated motion into a
      // "sunburst" of radiating streaks instead of a readable wing shape
      ctx.fillStyle = 'rgba(5,7,14,0.78)';
      ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'lighter';
      for(const b of butterflies){
        if(b.state === 'alive'){
          const renderY = b.y + Math.sin(b.flapPhase*2)*BOB_PX;
          for(const p of b.particles){
            const [wx, wy] = templateWorldPos(b, p, renderY);
            if(p.px === undefined){ p.px = wx; p.py = wy; }
            if(p.trailOn){
              if(!p.trail){
                p.trail = [];
                for(let i=0;i<FLIGHT_TRAIL_LEN;i++) p.trail.push({x:wx, y:wy});
              }
              // shift the short position history back one slot, then record
              // this frame's previous position at the front — a fixed-size
              // pool of reused points, no per-frame allocation
              for(let i=p.trail.length-1;i>0;i--){
                p.trail[i].x = p.trail[i-1].x; p.trail[i].y = p.trail[i-1].y;
              }
              p.trail[0].x = p.px; p.trail[0].y = p.py;
              drawFlightTrail(b, p);
            }
            drawFlightStreak(p.px, p.py, wx, wy, b, p);
            p.px = wx; p.py = wy;
          }
        } else if(b.state === 'materializing'){
          const t = Math.max(0, Math.min(1, b.stateT/MATERIALIZE_MS));
          const eased = 1 - Math.pow(1-t, 3);
          for(const p of b.particles){
            const [twx, twy] = templateWorldPos(b, p, b.y);
            drawParticle(twx + p.mox*(1-eased), twy + p.moy*(1-eased), b, p, eased);
          }
        } else if(b.state === 'dissolving'){
          const hueShift = Math.sin(b.flapPhase)*13; // reused across a particle's whole trail so it doesn't flicker between samples
          for(const p of b.particles){
            const t = Math.max(0, Math.min(1, (b.stateT-p.delay)/DISSOLVE_MS));
            // a quick bright flash as it turns to light, sustained while
            // it streams across, fading only as it arrives — the new
            // butterfly's own materialize fade-in picks up from there
            let alpha;
            if(t < 0.15) alpha = t/0.15;
            else if(t < 0.72) alpha = 1;
            else alpha = Math.max(0, 1-(t-0.72)/0.28);
            if(alpha <= 0.01 && t <= 0) continue;
            const glow = 1 + Math.max(0, 1-t*5)*2.4;
            const core = 0.7*p.sizeJ*b.sizeMult;
            const hue = b.hueBase + hueShift;
            // a soft, blurred streak trailing behind the current position
            // — several faded, widening echoes sampled a little earlier
            // along the same path, like light flowing through water
            // rather than a single hard-edged dot
            for(let k=0;k<TRAIL_OFFSETS.length;k++){
              const ta = alpha*TRAIL_FADE[k];
              if(ta <= 0.01) continue;
              const tk = Math.max(0, t-TRAIL_OFFSETS[k]);
              const [tx,ty] = dissolvePos(p, tk);
              ctx.beginPath();
              ctx.arc(tx, ty, core*(2.2+k*1.9)*Math.max(1,glow*0.6), 0, Math.PI*2);
              ctx.fillStyle = `hsla(${hue},100%,66%,${Math.min(1, 0.16*ta)})`;
              ctx.fill();
            }
            const [x,y] = dissolvePos(p, t);
            drawParticle(x, y, b, p, alpha, 1, glow);
          }
        }
      }
      ctx.globalCompositeOperation = 'source-over';
      ctx.lineCap = 'butt'; // restore the default so other modes' own line drawing isn't affected
    }

    return {
      init,
      tick(){
        const now = performance.now();
        const dt = lastT===null ? 0 : Math.min(0.05, (now-lastT)/1000);
        lastT = now;
        step(dt);
        render();
      },
      resize(){ init(); }
    };
  })();

  // ---------- mode switching ----------
  const modes = { life: Life, flow: Flow, mirror: Mirror, fire: Fire, morpho: Morpho };
  const descs = {
    life: '常に微小なノイズを注入して永遠に変化し続ける、生成し続けるセルオートマトン。クリック・タップした場所から細胞が生まれ、さらに波紋のようなリング状の生命の波が外側へ広がっていきます。',
    flow: 'ゆっくり進行するPerlinノイズ場に沿って粒子が流れ続ける、有機的なフローフィールド。クリック・タップすると衝撃波が輪となって広がり、粒子を弾き飛ばして発光バーストが起こります。',
    mirror: '波紋と揺らぎが重なり続ける、反射する膜(ミラー膜)のサーフェス。クリック・タップした場所から波紋が広がり、既存の揺らぎと重なり合います。',
    fire: '絶えず揺らめき続ける炎のシミュレーション。クリック・タップした場所に熱いかたまりが生まれ、炎に乗って立ちのぼりながら形を変えていきます。',
    morpho: '光の粒子でできたモルフォ蝶が、暗闇の中を静かに飛び回ります。触れると粒子になってふわりと霧散し、しばらくすると別の場所からまた新しい蝶が生まれます。'
  };
  let current = 'life';
  function activate(mode){
    current = mode;
    document.querySelectorAll('.tab').forEach(b=> b.classList.toggle('active', b.dataset.mode===mode));
    document.getElementById('desc').textContent = descs[mode];
    modes[mode].init();
  }
  document.querySelectorAll('.tab').forEach(btn=>{
    btn.addEventListener('click', ()=> activate(btn.dataset.mode));
  });

  // ---------- main loop ----------
  let last = performance.now(), frames=0, fpsAcc=0;
  function loop(now){
    const dt = now - last; last = now;
    frames++; fpsAcc += dt;
    if(fpsAcc > 500){
      document.getElementById('fps').textContent = Math.round(1000/(fpsAcc/frames)) + ' fps';
      frames=0; fpsAcc=0;
    }
    modes[current].tick();
    drawClickRings(now);
    requestAnimationFrame(loop);
  }

  resize();
  activate('flow');
  requestAnimationFrame(loop);
  window.addEventListener('resize', ()=>{ resize(); modes[current].resize(); });
})();
</script>
</body>
</html>
